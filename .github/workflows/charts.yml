name: Weekly DHH chart

on:
  schedule:
    - cron: "30 3 * * 1" # Mondays 09:00 IST
  workflow_dispatch:
    inputs:
      reresolve:
        description: "Re-search every YouTube match (~100 quota units per track)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run charts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          RERESOLVE: ${{ inputs.reresolve && '1' || '' }}
      - name: Commit chart
        run: |
          git config user.name "dhh-chart-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/charts data
          git diff --cached --quiet || git commit -m "chart: $(date -u +%G-W%V)"
          git push
